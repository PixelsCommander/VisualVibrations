<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual Vibrations</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="micOverlay" class="mic-overlay">
      <button id="micButton" class="mic-overlay-button">Use Microphone</button>
    </div>
    <section id="controlsPanel" class="panel is-collapsed" aria-label="Liquid controls">
      <button id="controlsToggle" class="panel-toggle" type="button" aria-expanded="false">Controls</button>
      <div class="meter">
        <span>Bass</span>
        <i id="bassMeter"></i>
      </div>
      <div class="meter">
        <span>Mids</span>
        <i id="midMeter"></i>
      </div>
      <div class="meter">
        <span>Treble</span>
        <i id="trebleMeter"></i>
      </div>
      <label>
        Environment
        <select id="environmentSelect">
          <option value="spruit">Spruit Sunrise</option>
          <option value="venice">Venice Sunset</option>
          <option value="blouberg">Blouberg Sunrise</option>
          <option value="overpass">Pedestrian Overpass</option>
        </select>
      </label>
      <label>Viscosity <input id="viscosity" type="range" min="0.02" max="1.2" step="0.01" value="0.35" /></label>
      <label>Mass <input id="mass" type="range" min="0.3" max="3" step="0.05" value="1" /></label>
      <label>Damping <input id="damping" type="range" min="0.01" max="0.5" step="0.01" value="0.08" /></label>
      <label>Wave Speed <input id="waveSpeed" type="range" min="0.2" max="3" step="0.05" value="1.45" /></label>
      <label>Resonance <input id="resonanceStrength" type="range" min="0" max="3" step="0.05" value="1.65" /></label>
      <label>Audio Force <input id="audioForceStrength" type="range" min="0" max="4" step="0.05" value="1.85" /></label>
      <label>Speaker Radius <input id="speakerRadius" type="range" min="0.12" max="0.7" step="0.01" value="0.34" /></label>
      <label>Speaker Force <input id="speakerForce" type="range" min="0" max="3" step="0.05" value="1.35" /></label>
      <label>Radial Ripples <input id="radialRippleStrength" type="range" min="0" max="3" step="0.05" value="1.85" /></label>
      <label>Droplet Chance <input id="dropletLift" type="range" min="0" max="4" step="0.05" value="1.25" /></label>
      <p>physically inspired real-time heightfield simulation</p>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
